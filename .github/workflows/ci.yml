name: Data and EDA checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  data-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Create environment
        run: python -m venv .venv
      - name: Install project dependencies
        run: make install
      - name: Download and verify the public source
        run: make download inspect
      - name: Execute EDA, verify environment, lint and test
        run: make phase2
