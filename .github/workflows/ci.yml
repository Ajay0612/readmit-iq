name: Data and baseline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  data-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Create environment
        run: python -m venv .venv
      - name: Install project dependencies
        run: make install
      - name: Download and verify the public source
        run: make download inspect
      - name: Execute source and EDA notebooks before freezing
        run: make notebook eda-notebook
      - name: Verify frozen patient split
        run: make split
      - name: Execute baseline notebook, verify environment, lint and test
        env:
          LOKY_MAX_CPU_COUNT: "2"
        run: make phase3
      - name: Show aggregate model diagnostics on failure
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ("baseline_model_results.csv", "feature_ablation_results.csv"):
              path = Path("reports/modeling") / name
              if path.exists():
                  print(f"\n{name}\n{path.read_text()}")
          PY
