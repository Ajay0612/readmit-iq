name: Data and development model checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  data-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0  # Verify that the final protocol commit follows its frozen code commit.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Create environment
        run: python -m venv .venv
      - name: Install project dependencies
        run: make install
      - name: Download and verify the public source
        run: make download inspect
      - name: Execute source and EDA notebooks before freezing
        run: make notebook eda-notebook
      - name: Verify frozen patient split
        run: make split
      - name: Execute baseline notebook, verify environment, lint and test
        env:
          LOKY_MAX_CPU_COUNT: "2"
        run: make phase3
      - name: Tune, calibrate and compare development models with patient isolation
        env:
          LOKY_MAX_CPU_COUNT: "2"
          MPLBACKEND: Agg
        run: make phase4
      - name: Preserve aggregate Phase 4 reproduction evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase4-development-evidence
          retention-days: 7
          path: |
            notebooks/04_model_optimization.ipynb
            reports/modeling/phase4/
            reports/modeling/tuning_report.md
            reports/modeling/calibration_report.md
            reports/modeling/model_selection_report.md
            reports/modeling/phase5_recommendation.md
            reports/figures/modeling/phase4/
      - name: Reproduce validation explanations and verify archived final evaluation
        env:
          LOKY_MAX_CPU_COUNT: "2"
          MPLBACKEND: Agg
          NUMBA_CACHE_DIR: .cache/numba
        # Never run make final-eval here: the real test prediction pass is not repeated.
        run: make phase5
      - name: Preserve aggregate Phase 5 evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase5-final-evidence
          retention-days: 7
          path: |
            notebooks/05_explainability_business_impact.ipynb
            notebooks/06_final_test_evaluation.ipynb
            reports/modeling/phase5/
            reports/modeling/final_evaluation_protocol.md
            reports/modeling/final_model_specification.json
            reports/modeling/final_model_metadata.json
            reports/figures/phase5/
      - name: Show aggregate model diagnostics on failure
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ("baseline_model_results.csv", "feature_ablation_results.csv"):
              path = Path("reports/modeling") / name
              if path.exists():
                  print(f"\n{name}\n{path.read_text()}")
          for name in ("validation_metrics.csv", "paired_comparisons.csv", "selection.json"):
              path = Path("reports/modeling/phase4") / name
              if path.exists():
                  print(f"\nphase4/{name}\n{path.read_text()}")
          PY
